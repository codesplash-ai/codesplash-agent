name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, label: macos-arm64, experimental: false }
          # macos-13 runners are retired (jobs queue forever); macos-15-intel is GitHub's Intel image.
          - { os: macos-15-intel, label: macos-x64, experimental: false }
          - { os: ubuntu-latest, label: linux-x64, experimental: false }
          - { os: ubuntu-24.04-arm, label: linux-arm64, experimental: false }
          - { os: windows-latest, label: windows-x64, experimental: true }
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      # Imports the Developer ID cert into a throwaway keychain and exports
      # APPLE_SIGNING_IDENTITY; release:build then signs + notarizes the macOS binary.
      - name: Add macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: chmod +x tools/add-macos-cert.sh && . ./tools/add-macos-cert.sh

      - name: Notice when macOS signing was skipped
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 == ''
        run: echo "::notice::MACOS_CERT_P12 secret not set — macOS binary ships ad-hoc signed (Gatekeeper will flag browser downloads)"

      # release:build compiles, launch-smokes (--version), archives, and checksums.
      # A target that fails its smoke produces no artifact and is not advertised.
      - name: Build release artifact
        run: bun run release:build

      - name: Launch smoke (POSIX)
        if: runner.os != 'Windows'
        run: |
          ./out/codesplash --version
          ./out/codesplash --doctor

      - name: Launch smoke (Windows)
        if: runner.os == 'Windows'
        run: |
          .\out\codesplash.exe --version
          .\out\codesplash.exe --doctor

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.label }}
          path: |
            out/codesplash-agent-*.tar.gz
            out/codesplash-agent-*.zip
            out/codesplash-agent-*.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing (OIDC)
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # npm trusted publishing requires npm >= 11.5.1 and Node >= 22.14.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble SHA256SUMS
        run: |
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=$(mktemp)
          awk "/^## ${GITHUB_REF_NAME#v}/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md > "$notes_file" || true
          if [ ! -s "$notes_file" ]; then echo "See CHANGELOG.md" > "$notes_file"; fi
          gh release create "$GITHUB_REF_NAME" \
            --title "CodeSplash Agent $GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            artifacts/codesplash-agent-* artifacts/SHA256SUMS

      # Auth is OIDC trusted publishing (no token): the codesplash-agent package on npm
      # must list this repo + release.yml as a trusted publisher. Provenance is automatic.
      - name: Publish to npm (trusted publishing)
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "codesplash-agent@${version}" version >/dev/null 2>&1; then
            echo "::notice::codesplash-agent@${version} already on npm — publish skipped"
            exit 0
          fi
          npm install -g npm@latest
          bun install --frozen-lockfile
          bun run build
          npm publish --access public

      - name: Update Homebrew tap
        if: env.TAP_GITHUB_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          arm_sha=$(awk '/darwin-arm64/{print $1}' artifacts/SHA256SUMS)
          x64_sha=$(awk '/darwin-x64/{print $1}' artifacts/SHA256SUMS)
          linux_x64_sha=$(awk '/linux-x64/{print $1}' artifacts/SHA256SUMS)
          linux_arm_sha=$(awk '/linux-arm64/{print $1}' artifacts/SHA256SUMS)
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/codesplash-ai/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/{{VERSION}}/${version}/g" \
              -e "s/{{SHA256_DARWIN_ARM64}}/${arm_sha}/g" \
              -e "s/{{SHA256_DARWIN_X64}}/${x64_sha}/g" \
              -e "s/{{SHA256_LINUX_X64}}/${linux_x64_sha}/g" \
              -e "s/{{SHA256_LINUX_ARM64}}/${linux_arm_sha}/g" \
              packaging/homebrew/codesplash-agent.rb > tap/Formula/codesplash-agent.rb
          cd tap
          git config user.name "codesplash-release-bot"
          git config user.email "release-bot@codesplash.ai"
          git add Formula/codesplash-agent.rb
          git commit -m "codesplash-agent ${version}"
          git push

      - name: Notice when tap update was skipped
        if: env.TAP_GITHUB_TOKEN == ''
        run: echo "::notice::TAP_GITHUB_TOKEN secret not set — Homebrew tap update skipped"
