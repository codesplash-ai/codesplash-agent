name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Format + typecheck + tests, the same gate release builds run.
      - name: Check
        run: bun run check

      # Interpreter-mode launch smoke; --doctor reports engine absence without failing.
      - name: Launch smoke
        run: |
          bun src/cli.ts --version
          bun src/cli.ts --doctor

      - name: Changelog release readiness
        run: bun scripts/check-changelog.ts
