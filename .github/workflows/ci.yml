name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-smoke:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, label: macos-arm64, experimental: false }
          # macos-13 runners are retired (jobs queue forever); macos-15-intel is GitHub's Intel image.
          - { os: macos-15-intel, label: macos-x64, experimental: false }
          - { os: ubuntu-latest, label: linux-x64, experimental: false }
          - { os: ubuntu-24.04-arm, label: linux-arm64, experimental: false }
          - { os: windows-latest, label: windows-x64, experimental: true }
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Quota-free by policy: format, typecheck, and the fixture-backed test suite.
      - name: Check
        run: bun run check

      - name: Emit JavaScript build
        run: bun run build

      - name: Build release artifact
        run: bun run release:build

      # Real launch smoke of the compiled executable (TTY-free paths).
      - name: Launch smoke (POSIX)
        if: runner.os != 'Windows'
        run: |
          ./out/codesplash --version
          ./out/codesplash --doctor

      - name: Launch smoke (Windows)
        if: runner.os == 'Windows'
        run: |
          .\out\codesplash.exe --version
          .\out\codesplash.exe --doctor

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codesplash-agent-${{ matrix.label }}
          path: |
            out/codesplash-agent-*.tar.gz
            out/codesplash-agent-*.zip
            out/codesplash-agent-*.sha256
          if-no-files-found: error
