name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_diagnostics:
        description: Collect per-path Windows ACL timings without rerunning the platform matrix
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    if: ${{ !inputs.windows_diagnostics }}
    name: check & sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --backend=copyfile

      - name: Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          # Disposable runner: permit bwrap's unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: macOS sandbox dependencies
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep

      # Format + typecheck + tests, the same gate release builds run.
      - name: Check
        run: bun run check

      # Interpreter-mode launch smoke; --doctor reports engine absence without failing.
      - name: Launch smoke
        run: |
          bun src/cli.ts --version
          bun src/cli.ts --doctor

      - name: Changelog release readiness
        run: bun scripts/check-changelog.ts

      - name: Standalone sandbox enforcement
        run: bun run release:build

  windows-shell:
    if: ${{ !inputs.windows_diagnostics }}
    name: Windows native acceptance (experimental until gate passes)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --backend=copyfile
      - run: bun run typecheck
      - run: bun test tests/core/windows-platform.test.ts tests/core/windows-native.test.ts
      - run: bun run build
      - run: bun dist/cli.js --version
      - name: Provision isolated runner account and WFP boundary
        run: bun src/cli.ts windows-sandbox install --apply
      - name: Prove WFP and native filesystem boundary
        run: ./scripts/run-windows-acceptance.ps1 -Mode Verify
      - name: Remove runner sandbox account and filters
        if: always()
        run: ./scripts/run-windows-acceptance.ps1 -Mode Cleanup

  distribution-image:
    if: ${{ !inputs.windows_diagnostics }}
    name: Distribution CI image and public docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build local image
        run: docker build -f packaging/ci/Dockerfile -t codesplash-ci:local .
      - name: Check offline distribution surfaces
        run: |
          docker run --rm --network=none codesplash-ci:local bun run typecheck
          docker run --rm --network=none codesplash-ci:local bun test tests/core/distribution.test.ts tests/core/identity.test.ts tests/core/network-integration.test.ts tests/core/platform-distribution.test.ts
          docker run --rm --network=none codesplash-ci:local bun run docs:build

  windows-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_diagnostics }}
    name: Windows ACL diagnostics (not acceptance)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --backend=copyfile
      - run: bun src/cli.ts windows-sandbox install --apply
      - name: Measure each real read/write grant
        run: ./scripts/run-windows-acceptance.ps1 -Mode Diagnose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-acl-diagnostic
          path: windows-acl-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove diagnostic account and ACLs
        if: always()
        run: ./scripts/run-windows-acceptance.ps1 -Mode Cleanup
